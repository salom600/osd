#
# /etc/pacman.conf - NovaOS build-time pacman configuration
#
# Based on Arch Linux defaults; tuned for ISO build.
# Includes [multilib] for 32-bit graphics drivers (NVIDIA/AMD wine etc.)
# and the [novaos] local repo where we publish NovaOS-branding packages
# built fresh in CI (calamares-branding-novaos, novaos-artwork, etc.)
#

[options]
HoldPkg           = pacman glibc
Architecture      = auto
CheckSpace
SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 8
VerbosePkgLists
Color
DisableDownloadTimeout
NoProgressBar

# --- Core Arch repos (since 2023, [community] is merged into [extra]) ---
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# --- NovaOS local repo (populated at build-time by CI) ---
# This is created by the GitHub Actions workflow before invoking mkarchiso,
# holding packages like `novaos-artwork`, `novaos-calamares-config`, etc.
[novaos]
SigLevel = Optional TrustAll
Server = file:///tmp/novaos-repo/x86_64
