DEFAULT novaos
PROMPT 0
TIMEOUT 150
FONT /%INSTALL_DIR%/boot/syslinux/unicode.pf2
NOESCAPE 1
ALLOWOPTIONS 0
KBDMAP /%INSTALL_DIR%/boot/syslinux/novaos.kbd

LABEL novaos
    MENU LABEL NovaOS Live (x86_64)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% novaos.boot=live nouveau.modeset=1 amdgpu.si_support=1 amdgpu.cik_support=1 i915.fastboot=1 i915.enable_fbc=1 quiet splash loglevel=3 systemd.show_status=false

LABEL novaos-safe
    MENU LABEL NovaOS Live (safe graphics, nomodeset)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% novaos.boot=safe nomodeset 3 quiet systemd.show_status=false

LABEL novaos-verbose
    MENU LABEL NovaOS Live (verbose, debug)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% novaos.boot=verbose

ONTIMEOUT novaos
