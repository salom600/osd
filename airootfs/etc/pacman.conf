#
# /etc/pacman.conf - in-image pacman configuration (NovaOS)
#
# This is the pacman config installed INSIDE the live ISO and on installed
# systems. It enables [multilib] (for 32-bit graphics + Wine) and a stable
# mirrorlist. After install, NovaOS-Firstboot will refresh mirrors via reflector.
#

[options]
HoldPkg           = pacman glibc
Architecture      = auto
CheckSpace
SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 8
VerbosePkgLists
Color
ILoveCandy

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# NovaOS supplementary repo (Artix/AUR-pinned packages built by CI)
# Disabled by default - enabled by novaos-update when reachable.
#[novaos]
#Server = https://github.com/salom600/osd/releases/download/repo/$arch
#SigLevel = Optional TrustAll
