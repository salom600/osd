# NovaOS - systemd-boot loader config (UEFI)
# This is used when the ISO is booted in UEFI mode.
# archiso with bootmode "uefi-x64.systemd-boot.esp" reads this file.

timeout 15
default novaos
console-mode max
editor no

# --- NovaOS live (default) ---
label novaos
    menu label NovaOS Live (x86_64)
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    initrd /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
    options archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% novaos.boot=live nouveau.modeset=1 radeon.cik_support=0 radeon.si_support=0 amdgpu.si_support=1 amdgpu.cik_support=1 i915.fastboot=1 i915.enable_fbc=1 i915.enable_guc=2 quiet splash loglevel=3 systemd.show_status=false

# --- NovaOS live with safe graphics (nomodeset, fallback VESA) ---
label novaos-safe
    menu label NovaOS Live (safe graphics, nomodeset)
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    initrd /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
    options archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% novaos.boot=safe nomodeset 3 quiet systemd.show_status=false

# --- NovaOS live (verbose, for debugging) ---
label novaos-verbose
    menu label NovaOS Live (verbose, debug)
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    initrd /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
    options archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% novaos.boot=verbose

# --- Memtest86+ ---
label memtest
    menu label Memtest86+
    linux /%INSTALL_DIR%/boot/memtest
