# =============================================================================
# NovaOS - Automatic build-failure analyzer and patcher
# =============================================================================
# Triggered automatically when build-iso.yml fails. Reads the failed run's
# logs, analyzes them with rule-based + LLM heuristics, applies a fix to
# the repo, commits, and re-triggers the build.
#
# Hard limits:
#   - Will not run more than 5 times for the same commit SHA.
#   - Will not commit secrets or workflow files itself.
#   - Each fix is logged to AUTO_FIX_LOG.md for transparency.
# =============================================================================

name: Auto-Fix Failed Build

on:
  workflow_run:
    workflows: [ "Build NovaOS ISO" ]
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Failed run ID to analyze'
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: auto-fix-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  auto-fix:
    name: Analyze failure and apply patch
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      # ----------------------------------------------------------------------
      # 1. Resolve the failed run ID + commit SHA
      # ----------------------------------------------------------------------
      - name: Resolve run context
        id: ctx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOVAOS_TOKEN: ${{ secrets.NOVAOS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.run_id }}" ]; then
            RUN_ID="${{ github.event.inputs.run_id }}"
            REPO="${{ github.repository }}"
          else
            RUN_ID="${{ github.event.workflow_run.id }}"
            REPO="${{ github.event.workflow_run.repository.full_name }}"
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"

          # Fetch run metadata to get the commit SHA
          RUN_JSON=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}")
          HEAD_SHA=$(echo "$RUN_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['head_sha'])")
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved: repo=$REPO  run_id=$RUN_ID  sha=$HEAD_SHA"

      # ----------------------------------------------------------------------
      # 2. Check retry budget (max 5 attempts per SHA)
      # ----------------------------------------------------------------------
      - name: Check retry budget
        id: budget
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="${{ steps.ctx.outputs.head_sha }}"
          REPO="${{ steps.ctx.outputs.repo }}"
          # List recent auto-fix commits authored by github-actions
          ATTEMPTS=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/commits?per_page=50" \
            | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          count = 0
          for c in data:
              msg = c.get('commit', {}).get('message', '')
              sha = c.get('sha', '')
              # Count auto-fix commits that target our SHA
              if 'auto-fix:' in msg.lower() and '${SHA}'[:7] in msg:
                  count += 1
          print(count)
          ")
          echo "attempts=$ATTEMPTS" >> "$GITHUB_OUTPUT"
          if [ "$ATTEMPTS" -ge 5 ]; then
            echo "::warning::Auto-fix budget exhausted ($ATTEMPTS/5) for $SHA - skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Auto-fix attempt $((ATTEMPTS + 1))/5"
          fi

      # ----------------------------------------------------------------------
      # 3. Checkout at the failed SHA
      # ----------------------------------------------------------------------
      - name: Checkout at failed SHA
        if: steps.budget.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ctx.outputs.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.NOVAOS_TOKEN || secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------------------
      # 4. Set up Python for the analyzer
      # ----------------------------------------------------------------------
      - name: Set up Python
        if: steps.budget.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analyzer deps
        if: steps.budget.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir requests pyyaml

      # ----------------------------------------------------------------------
      # 5. Download the failed run's logs
      # ----------------------------------------------------------------------
      - name: Download failed run logs
        if: steps.budget.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.ctx.outputs.run_id }}"
          REPO="${{ steps.ctx.outputs.repo }}"
          mkdir -p logs
          # Download the logs ZIP
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}/logs" \
            -o logs/run-logs.zip
          # Unzip
          cd logs && unzip -o -q run-logs.zip || true
          # Concatenate all log files into one for easier analysis
          find . -name '*.txt' -print0 | xargs -0 cat > combined.log 2>/dev/null || true
          ls -la
          wc -l combined.log || true

      # ----------------------------------------------------------------------
      # 6. Also download the build-logs artifact (richer detail)
      # ----------------------------------------------------------------------
      - name: Download build-logs artifact
        if: steps.budget.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: novaos-build-logs-${{ steps.ctx.outputs.run_id }}
          path: build-logs
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # ----------------------------------------------------------------------
      # 7. Run the analyzer + patcher
      # ----------------------------------------------------------------------
      - name: Analyze logs and apply fix
        if: steps.budget.outputs.skip != 'true'
        id: analyze
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOVAOS_TOKEN: ${{ secrets.NOVAOS_TOKEN }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          COMMIT_SHA: ${{ steps.ctx.outputs.head_sha }}
          ATTEMPT: ${{ steps.budget.outputs.attempts }}
        run: |
          set -euo pipefail
          python3 scripts/auto_fix.py \
            --logs-dir logs \
            --build-logs-dir build-logs \
            --repo-root . \
            --commit-sha "$COMMIT_SHA" \
            --attempt "$ATTEMPT" \
            --output-json fix-result.json
          # Surface result
          cat fix-result.json
          echo "applied=$(python3 -c 'import json; print(json.load(open("fix-result.json"))["applied"])')" >> "$GITHUB_OUTPUT"
          echo "summary=$(python3 -c 'import json; print(json.load(open("fix-result.json"))["summary"])')" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------------------
      # 8. Commit + push the fix
      # ----------------------------------------------------------------------
      - name: Commit and push fix
        if: steps.budget.outputs.skip != 'true' && steps.analyze.outputs.applied == 'true'
        env:
          NOVAOS_TOKEN: ${{ secrets.NOVAOS_TOKEN || secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
          ATTEMPT: ${{ steps.budget.outputs.attempts }}
          SUMMARY: ${{ steps.analyze.outputs.summary }}
        run: |
          set -euo pipefail
          git config user.name  "novaos-auto-fix[bot]"
          git config user.email "auto-fix@novaos.bot"
          # Stage all changes from the patcher
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit - fix produced no edits."
            exit 0
          fi
          # Authoritative commit message - includes SHA + attempt number so the
          # budget tracker can count attempts reliably.
          git commit -m "auto-fix: ${HEAD_SHA:0:7} attempt $((ATTEMPT + 1))/5 - ${SUMMARY}

          Auto-applied by NovaOS auto-fix workflow.
          Target commit: ${HEAD_SHA}
          Attempt: $((ATTEMPT + 1))/5"

          # Push using the NOVAOS_TOKEN (has repo:write scope)
          git push "https://x-access-token:${NOVAOS_TOKEN}@github.com/${{ github.repository }}.git" \
            HEAD:${{ github.event.workflow_run.head_branch || github.ref_name }}

      # ----------------------------------------------------------------------
      # 9. Re-trigger the build workflow
      # ----------------------------------------------------------------------
      - name: Re-trigger build
        if: steps.budget.outputs.skip != 'true' && steps.analyze.outputs.applied == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOVAOS_TOKEN: ${{ secrets.NOVAOS_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          # Use the NOVAOS_TOKEN if available (can trigger workflows), else GITHUB_TOKEN
          TOKEN="${NOVAOS_TOKEN:-$GH_TOKEN}"
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-iso.yml/dispatches" \
            -d "{\"ref\":\"${BRANCH}\"}"
          echo "Build re-triggered on ${BRANCH}"

      # ----------------------------------------------------------------------
      # 10. If no fix could be applied, open an issue (or comment)
      # ----------------------------------------------------------------------
      - name: File issue if no fix applied
        if: steps.budget.outputs.skip != 'true' && steps.analyze.outputs.applied != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d "{
              \"title\": \"[auto-fix] Could not auto-repair build for ${{ steps.ctx.outputs.head_sha }}\",
              \"body\": \"The NovaOS auto-fix workflow could not automatically patch this build failure.\\n\\nFailed run: https://github.com/${{ github.repository }}/actions/runs/${{ steps.ctx.outputs.run_id }}\\n\\nManual investigation needed.\",
              \"labels\": [\"auto-fix-failed\", \"build\"]
            }"
          echo "Issue filed."
