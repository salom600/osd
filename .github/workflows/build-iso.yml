# =============================================================================
# NovaOS - main ISO build workflow
# =============================================================================
# Builds a bootable NovaOS ISO using archiso inside an Arch Linux container.
# Triggered on every push to main, on tags (creates a release), on PR, and
# supports manual dispatch.
#
# Output: a `novaos-<date>.iso` artifact uploaded to GitHub Actions.
# Tag pushes also create a GitHub Release with the ISO attached.
# =============================================================================

name: Build NovaOS ISO

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build from (defaults to current branch)'
        required: false
        default: ''

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: false

env:
  ISO_NAME: novaos
  ARTIFACT_RETENTION_DAYS: 14

jobs:
  build:
    name: Build ISO (x86_64)
    runs-on: ubuntu-22.04
    # Run the ENTIRE job inside an archlinux:latest container.
    # This avoids Docker-in-Docker volume mount issues and gives us
    # a real Arch Linux environment with pacman + archiso.
    # --privileged is needed for mkarchiso (loop devices, mount, mksquashfs).
    container:
      image: archlinux:latest
      options: --privileged
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read

    steps:
      # ----------------------------------------------------------------------
      # 1. Checkout (into the Arch container's filesystem - no volume mount)
      # ----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      # ----------------------------------------------------------------------
      # 2. Install archiso + base deps in the Arch container
      # ----------------------------------------------------------------------
      - name: Install archiso and base dependencies
        run: |
          set -euo pipefail
          echo "=== Bootstrap pacman keyring ==="
          pacman-key --init
          pacman-key --populate archlinux

          echo "=== Installing archiso + helpers ==="
          pacman -Sy --noconfirm --needed \
            archiso \
            git \
            reflector \
            pacman-contrib \
            sudo \
            bash \
            squashfs-tools \
            libisoburn \
            mtools \
            dosfstools \
            python \
            python-pip \
            openssh

      # ----------------------------------------------------------------------
      # 3. Set up mirrorlist + pacman config
      # ----------------------------------------------------------------------
      - name: Configure mirrorlist and pacman
        run: |
          set -euo pipefail

          echo "=== Setting up mirrorlist ==="
          # Use the hardcoded fallback mirrorlist - ultra-reliable CDN mirrors.
          cp scripts/fallback-mirrorlist /etc/pacman.d/mirrorlist

          echo "=== Setting up pacman.conf ==="
          # Install a clean /etc/pacman.conf with [core], [extra], [multilib].
          # No [novaos] repo here - that's only needed by mkarchiso later
          # via our repo pacman.conf.
          cp scripts/container-pacman.conf /etc/pacman.conf

          # Verify
          echo "Mirrorlist:"
          cat /etc/pacman.d/mirrorlist
          echo "---"
          echo "Enabled repos:"
          grep -E '^\[' /etc/pacman.conf

          # Force a fresh db sync
          echo "=== Syncing pacman databases ==="
          pacman -Syy --noconfirm || { echo "FATAL: pacman -Syy failed"; exit 1; }

          # Sanity-check: can we find a known package in EACH repo?
          echo "=== Sanity-checking repos ==="
          for pkg in bash discover lib32-mesa; do
            if pacman -Si "$pkg" >/dev/null 2>&1; then
              echo "  OK: $pkg found"
            else
              echo "  FAIL: $pkg NOT found"
              exit 1
            fi
          done
          echo "All sanity checks passed."

      # ----------------------------------------------------------------------
      # 4. Build the local novaos-repo (empty placeholder)
      # ----------------------------------------------------------------------
      - name: Create local novaos-repo
        run: |
          set -euo pipefail
          mkdir -p /tmp/novaos-repo/x86_64
          cd /tmp/novaos-repo/x86_64
          repo-add novaos.db.tar.gz 2>/dev/null || true

      # ----------------------------------------------------------------------
      # 5. Run mkarchiso
      # ----------------------------------------------------------------------
      - name: Build NovaOS ISO
        id: archiso_build
        run: |
          set -euo pipefail
          mkdir -p work out build-logs

          echo "=== Profile validation ==="
          test -f profiledef.sh || { echo "FATAL: profiledef.sh missing"; exit 1; }
          test -f packages.x86_64 || { echo "FATAL: packages.x86_64 missing"; exit 1; }

          echo "=== Running mkarchiso ==="
          mkarchiso -v -w "$(pwd)/work" -o "$(pwd)/out" . 2>&1 | tee build-logs/mkarchiso.log

          echo "=== Build complete ==="
          ls -la out/

      # ----------------------------------------------------------------------
      # 6. Verify the ISO exists and compute checksums
      # ----------------------------------------------------------------------
      - name: Verify ISO and compute SHA256
        id: verify
        run: |
          set -euo pipefail
          ISO=$(ls -1 out/*.iso 2>/dev/null | head -1 || true)
          if [ -z "$ISO" ]; then
            echo "FATAL: No ISO produced in out/"
            ls -la out/ || true
            exit 1
          fi
          echo "iso_path=$ISO" >> "$GITHUB_OUTPUT"
          echo "iso_name=$(basename "$ISO")" >> "$GITHUB_OUTPUT"
          sha256sum "$ISO" > "$ISO.sha256"
          ls -la out/
          cat "$ISO.sha256"

      # ----------------------------------------------------------------------
      # 7. Upload build logs as artifact (for debugging + auto-fix)
      # ----------------------------------------------------------------------
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novaos-build-logs-${{ github.run_id }}
          path: |
            build-logs/
          retention-days: 30
          if-no-files-found: ignore

      # ----------------------------------------------------------------------
      # 8. Upload the ISO as artifact (always)
      # ----------------------------------------------------------------------
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: novaos-iso-${{ github.run_id }}
          path: |
            out/*.iso
            out/*.iso.sha256
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error

      # ----------------------------------------------------------------------
      # 9. On tag push, create a GitHub Release with the ISO
      # ----------------------------------------------------------------------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.iso
            out/*.iso.sha256
          name: NovaOS ${{ github.ref_name }}
          body: |
            # NovaOS ${{ github.ref_name }}

            Automated build from `${{ github.sha }}`.

            ## Download
            - `novaos-*.iso`  - the live/install ISO (x86_64)
            - `novaos-*.iso.sha256`  - SHA256 checksum

            ## Install
            1. Flash the ISO to a USB stick (>=4GB) with `dd` or Rufus / Etcher.
            2. Boot from it.
            3. Click "Install NovaOS" on the desktop to launch Calamares.

            ## Verification
            ```sh
            sha256sum -c novaos-*.iso.sha256
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------------------
      # 10. Summary
      # ----------------------------------------------------------------------
      - name: Summary
        if: always()
        run: |
          echo "## NovaOS Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.verify.outputs.iso_path }}" ]; then
            SIZE=$(du -h "${{ steps.verify.outputs.iso_path }}" | cut -f1)
            echo "✅ ISO built: \`${{ steps.verify.outputs.iso_name }}\` ($SIZE)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "SHA256:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat "${{ steps.verify.outputs.iso_path }}.sha256" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Build failed - see build-logs artifact." >> "$GITHUB_STEP_SUMMARY"
          fi
